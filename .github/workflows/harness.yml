name: Prompt 00 contracts

on: [pull_request, workflow_dispatch]

permissions:
  contents: read

jobs:
  harness:
    name: Harness (${{ matrix.database }})
    runs-on: ubuntu-latest
    continue-on-error: ${{ matrix.database == 'sqlite-advisory' }}
    strategy:
      fail-fast: false
      matrix:
        database: [postgresql, sqlite-advisory]
    services:
      db:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: dlj_test
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install -r requirements.txt -r tests/harness/requirements.txt
      - run: npm ci --prefix frontend
      - run: npm --prefix frontend run build
      - run: python -m playwright install --with-deps chromium
      - name: Full PostgreSQL gate
        if: matrix.database == 'postgresql'
        env:
          DLJ_DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/dlj_test
        run: python -m pytest tests/ -q -k "not exp_dlj" --timeout=120
      - name: Browser regression gate
        if: matrix.database == 'postgresql'
        env:
          DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/dlj_test
          DLJ_DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/dlj_test
        run: |
          npm ci
          npm --prefix frontend run typecheck:e2e
          npx --no-install playwright install chromium
          python -m db.migrate
          python -m uvicorn jm_service:app --host 127.0.0.1 --port 8080 &
          server_pid=$!
          trap 'kill "$server_pid"' EXIT
          curl --retry 20 --retry-delay 1 --retry-connrefused --fail --silent http://127.0.0.1:8080/v1/health
          npx --no-install playwright test
      - name: Advisory contracts and browser controls
        if: matrix.database == 'sqlite-advisory'
        run: python -m pytest tests/harness --harness-sqlite -q --strict-markers --timeout=30
      - name: Existing PostgreSQL regression suite
        if: matrix.database == 'postgresql'
        env:
          DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/dlj_test
          DLJ_DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/dlj_test
        run: >-
          python -m pytest -q --timeout=120 -m "not sqlite_only" --ignore=tests
          --ignore=scripts/test_paddle.py
          --ignore=test_jm_docker_live.py --ignore=test_jm_docker_live_v2.py
          --ignore=test_jm_docker_live_v3.py --ignore=test_ops_e2e.py
      - name: Existing SQLite compatibility suite
        if: always() && matrix.database == 'sqlite-advisory'
        env:
          DATABASE_URL: 'sqlite+aiosqlite:///:memory:'
          DLJ_DATABASE_URL: 'sqlite+aiosqlite:///:memory:'
        run: >-
          python -m pytest -q --timeout=120 --ignore=tests/harness -k "not exp_dlj"
          --ignore=scripts/test_paddle.py
          --ignore=test_jm_docker_live.py --ignore=test_jm_docker_live_v2.py
          --ignore=test_jm_docker_live_v3.py --ignore=test_ops_e2e.py
